      <div

          z-index: 100;
          display: grid;
          place-items: center;
          background: #f4f7fd;

        "
      ></div>
      <script>
        document.documentElement.dataset.boot = "1";
        document.documentElement.classList.add("is-loading");
        // a reload always starts at the top (the story and its 3D mark begin there);

        if (!location.hash) window.scrollTo(0, 0);
      </script>
